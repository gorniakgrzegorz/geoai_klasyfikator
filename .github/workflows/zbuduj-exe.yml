name: Zbuduj program Windows

# Buduje "GeoAI Klasyfikator.exe" na maszynie Windows w chmurze GitHuba,
# a obok niego instalator Inno Setup.
#
# Kiedy się uruchamia:
#   - po każdym wypchnięciu zmian na gałąź główną: tylko buduje,
#   - po ręcznym kliknięciu "Run workflow" w zakładce Actions: buduje, a gdy
#     w polu "wersja" wpiszesz numer (na przykład 1.0.2), dodatkowo publikuje
#     wydanie v1.0.2 z kompletem plików.
#
# Wydania w tym repozytorium są niezmienne (immutable releases): po
# opublikowaniu nie da się do nich dołączyć plików, a znacznika nie da się
# użyć ponownie. Dlatego workflow sam zakłada wydanie jako szkic, dołącza
# pliki i dopiero na końcu publikuje. Nie zakładaj wydań ręcznie na stronie.
#
# Gotowe pliki znajdziesz zawsze w zakładce Actions, w podsumowaniu przebiegu,
# w sekcji Artifacts. Zachowywane są przez 90 dni.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      wersja:
        description: "Numer wydania do opublikowania, np. 1.0.2 (puste: tylko zbuduj)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdz numer wersji przed wydaniem
        if: github.event_name == 'workflow_dispatch' && inputs.wersja != ''
        shell: pwsh
        env:
          WERSJA: ${{ inputs.wersja }}
        run: |
          # Szybka kontrola, zanim zacznie sie kilkuminutowe budowanie:
          # numer musi miec postac X.Y.Z, zgadzac sie z numerem wpisanym
          # w pliki programu, a znacznik nie moze jeszcze istniec.
          if ($env:WERSJA -notmatch '^\d+\.\d+\.\d+$') {
            throw "Numer wersji musi miec postac X.Y.Z, np. 1.0.2"
          }
          $w = $env:WERSJA
          $sprawdz = @(
            @("program_exe/okno.py", "WERSJA = `"$w`""),
            @("geoai_klasyfikator/metadata.txt", "version=$w"),
            @("narzedzia/wersja_angielska/metadata.txt", "version=$w"),
            @("program_exe/instalator.iss", "`"$w`""),
            @("program_exe/wersja.txt", "'ProductVersion', '$w.0'"),
            @("program_cli/geoai_cli/__init__.py", "__version__ = `"$w`""),
            @("CITATION.cff", "version: `"$w`"")
          )
          foreach ($s in $sprawdz) {
            if (-not (Select-String -Path $s[0] -SimpleMatch -Pattern $s[1] -Quiet)) {
              throw ("W pliku " + $s[0] + " nie ma wersji " + $w)
            }
          }
          $tag = "v$w"
          $istnieje = git ls-remote --tags origin "refs/tags/$tag"
          if ($istnieje) {
            throw "Znacznik $tag juz istnieje. Wydania sa niezmienne, podaj nowy numer."
          }
          Write-Host "Wersja $w gotowa do wydania jako $tag"

      - name: Zainstaluj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj biblioteki
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r program_cli/requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Sprawdz kod przed budowaniem
        shell: pwsh
        run: |
          # Szybkie sprawdzenie skladni calego kodu. Taniej wylapac blad
          # tutaj niz po kilku minutach pakowania.
          python -m compileall -q program_exe program_cli geoai_klasyfikator GeoAI_Classification
          if ($LASTEXITCODE -ne 0) { throw "Blad skladni w kodzie" }
          # Wersja angielska wtyczki jest generowana z polskiej. Jesli ktos
          # zmienil polska i nie przebudowal angielskiej (albo zostawil
          # napis bez tlumaczenia), zatrzymujemy sie tutaj.
          python narzedzia/wersja_angielska.py sprawdz
          if ($LASTEXITCODE -ne 0) { throw "Wersja angielska wtyczki jest nieaktualna" }
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Zbuduj plik wykonywalny
        shell: pwsh
        working-directory: program_exe
        run: |
          pyinstaller GeoAI_Klasyfikator.spec --noconfirm --clean
          $exe = "dist/GeoAI Klasyfikator/GeoAI Klasyfikator.exe"
          if (-not (Test-Path $exe)) { throw "Budowanie nie dalo pliku exe" }

      - name: Sprawdz plik wykonywalny
        shell: pwsh
        working-directory: program_exe
        run: |
          # Program jest okienkowy, wiec nie uruchomimy go bez pulpitu.
          # Sprawdzamy nazwe, rozmiar i obecnosc ikony.
          Add-Type -AssemblyName System.Drawing
          $exe = Get-Item "dist/GeoAI Klasyfikator/GeoAI Klasyfikator.exe"
          Write-Host ("Nazwa:   {0}" -f $exe.Name)
          Write-Host ("Rozmiar: {0:N0} bajtow" -f $exe.Length)
          if ($exe.Length -lt 500000) { throw "Plik exe podejrzanie maly" }
          $ikona = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if ($null -eq $ikona) { throw "Plik exe nie ma ikony" }
          Write-Host ("Ikona:   {0} na {1} pikseli" -f $ikona.Width, $ikona.Height)
          # Nazwa i wersja produktu musza byc wpisane w plik. Wymaga tego
          # podpisywanie kodu przez SignPath.io, a Windows pokazuje je
          # we wlasciwosciach pliku.
          $w = $exe.VersionInfo
          Write-Host ("Produkt: {0} {1}" -f $w.ProductName, $w.ProductVersion)
          if ($w.ProductName -ne "GeoAI Klasyfikator") {
            throw "Brak albo zla nazwa produktu w pliku exe"
          }
          if ([string]::IsNullOrWhiteSpace($w.ProductVersion)) {
            throw "Brak wersji produktu w pliku exe"
          }

      - name: Zainstaluj Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Zbuduj instalator
        shell: pwsh
        working-directory: program_exe
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Nie znaleziono ISCC.exe" }
          & $iscc instalator.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup zwrocil blad" }
          Get-ChildItem instalator -Filter *.exe | ForEach-Object {
            Write-Host ("Instalator: {0} ({1:N0} bajtow)" -f $_.Name, $_.Length)
          }

      - name: Spakuj wersje przenosna
        shell: pwsh
        working-directory: program_exe/dist
        run: |
          Compress-Archive -Path "GeoAI Klasyfikator" `
                           -DestinationPath "GeoAI_Klasyfikator_win.zip" -Force

      - name: Spakuj wtyczke QGIS
        shell: pwsh
        run: |
          # Paczka do instalacji w QGIS (Wtyczki, Zarzadzanie wtyczkami,
          # Zainstaluj z pliku ZIP). Folder wtyczki musi lezec w korzeniu
          # archiwum, a sciezki musza miec ukosniki /, inaczej QGIS na
          # Linuksie i macOS jej nie rozpakuje. Dlatego Python, nie
          # Compress-Archive. Pomijamy __pycache__ z kroku sprawdzania kodu.
          $skrypt = @(
            "import pathlib, zipfile",
            "for nazwa in ('geoai_klasyfikator', 'GeoAI_Classification'):",
            "    zrodlo = pathlib.Path(nazwa)",
            "    cel = 'program_exe/dist/' + nazwa + '.zip'",
            "    with zipfile.ZipFile(cel, 'w', zipfile.ZIP_DEFLATED) as z:",
            "        for p in sorted(zrodlo.rglob('*')):",
            "            if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc':",
            "                z.write(p, p.as_posix())",
            "    print('wtyczka spakowana:', cel)"
          )
          $skrypt | Set-Content -Path spakuj_wtyczke.py -Encoding utf8
          python spakuj_wtyczke.py
          if ($LASTEXITCODE -ne 0) { throw "Nie udalo sie spakowac wtyczki" }

      - name: Policz sumy kontrolne
        shell: pwsh
        run: |
          # Sumy SHA-256 pozwalaja kazdemu sprawdzic, ze pobrany plik jest
          # dokladnie tym, ktory zbudowala ta maszyna, i nikt go po drodze
          # nie podmienil. Przegladarka i tak ostrzeze przed nowym plikiem
          # exe, wiec suma kontrolna jest jedyna rzeczowa odpowiedzia.
          $pliki = @()
          $pliki += Get-ChildItem "program_exe/dist/GeoAI_Klasyfikator_win.zip"
          $pliki += Get-ChildItem "program_exe/dist/geoai_klasyfikator.zip"
          $pliki += Get-ChildItem "program_exe/dist/GeoAI_Classification.zip"
          $pliki += Get-ChildItem "program_exe/instalator" -Filter *.exe -ErrorAction SilentlyContinue
          $linie = foreach ($p in $pliki) {
            $h = (Get-FileHash $p.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host ("{0}  {1}" -f $h, $p.Name)
            "{0}  {1}" -f $h, $p.Name
          }
          $naglowek = @(
            "GeoAI Klasyfikator, sumy kontrolne SHA-256",
            ("zbudowano: " + (Get-Date -Format "yyyy-MM-dd HH:mm") + " UTC"),
            ("przebieg:  " + $env:GITHUB_SERVER_URL + "/" + $env:GITHUB_REPOSITORY + "/actions/runs/" + $env:GITHUB_RUN_ID),
            ("commit:    " + $env:GITHUB_SHA),
            "",
            "Sprawdzenie w PowerShellu:",
            "    Get-FileHash .\GeoAI_Klasyfikator_Setup.exe -Algorithm SHA256",
            ""
          )
          ($naglowek + $linie) | Set-Content -Path "program_exe/SUMY-KONTROLNE.txt" -Encoding utf8

      - name: Odloz pliki do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: GeoAI_Klasyfikator_win
          path: |
            program_exe/dist/GeoAI_Klasyfikator_win.zip
            program_exe/dist/geoai_klasyfikator.zip
            program_exe/dist/GeoAI_Classification.zip
            program_exe/instalator/*.exe
            program_exe/SUMY-KONTROLNE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Opublikuj wydanie
        if: github.event_name == 'workflow_dispatch' && inputs.wersja != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WERSJA: ${{ inputs.wersja }}
        run: |
          $pliki = @("program_exe/dist/GeoAI_Klasyfikator_win.zip",
                     "program_exe/dist/geoai_klasyfikator.zip",
                     "program_exe/dist/GeoAI_Classification.zip",
                     "program_exe/SUMY-KONTROLNE.txt")
          $inst = Get-ChildItem -Path "program_exe/instalator" -Filter *.exe -ErrorAction SilentlyContinue
          if ($inst) { $pliki += $inst.FullName }
          # Opis wydania budujemy jako liste linii i zapisujemy do pliku.
          # Tekstu wielowierszowego nie da sie tu wpisac wprost, bo
          # skladnia PowerShella klocilaby sie ze skladnia YAML-a.
          $plot = [char]0x60
          $ramka = "$plot$plot$plot"
          $opis = @(
            "Program dla Windows: instalator (plik Setup.exe) albo wersja przenosna (GeoAI_Klasyfikator_win.zip). Wtyczka QGIS: geoai_klasyfikator.zip, instalacja przez Wtyczki, Zarzadzanie wtyczkami, Zainstaluj z pliku ZIP. English edition of the QGIS plugin: GeoAI_Classification.zip.",
            "",
            "## Ostrzezenie przegladarki",
            "",
            "Plik nie jest podpisany certyfikatem wydawcy, wiec Chrome, Edge i Windows",
            "SmartScreen pokaza ostrzezenie. Jest to brak reputacji nowego pliku, a nie",
            "wykryty wirus. Zeby sie upewnic, ze pobrany plik jest dokladnie tym, ktory",
            "zbudowal GitHub, porownaj sume kontrolna:",
            "",
            "    Get-FileHash .\GeoAI_Klasyfikator_Setup.exe -Algorithm SHA256",
            "",
            "## Podpisywanie kodu",
            "",
            "Pliki nie sa jeszcze podpisane. Projekt przygotowuje wniosek do programu SignPath Foundation. Zasady podpisywania:",
            "Free code signing provided by SignPath.io, certificate by SignPath Foundation.",
            ("Code signing policy: " + $env:GITHUB_SERVER_URL + "/" + $env:GITHUB_REPOSITORY + "/blob/main/CODE_SIGNING_POLICY.md"),
            "",
            "## Sumy kontrolne",
            "",
            $ramka
          )
          $opis += (Get-Content "program_exe/SUMY-KONTROLNE.txt")
          $opis += $ramka
          $opis | Set-Content -Path opis-wydania.md -Encoding utf8
          # Kolejnosc wymagana przez niezmienne wydania: szkic, pliki,
          # publikacja. Znacznik powstaje przy publikacji, na dokladnie
          # tym commicie, z ktorego zbudowano pliki.
          $tag = "v$env:WERSJA"
          gh release create $tag @pliki --draft `
            --target $env:GITHUB_SHA `
            --title "GeoAI Klasyfikator $tag" `
            --notes-file opis-wydania.md `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Nie udalo sie zalozyc szkicu wydania" }
          gh release edit $tag --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Nie udalo sie opublikowac wydania" }
          Write-Host "Opublikowano $tag"
